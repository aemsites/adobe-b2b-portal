name = "cug-adobe-oauth-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ── B2B Portal environment ─────────────────────────────────────────────

[env.b2b]
name = "b2b-portal"

[env.b2b.vars]
ORIGIN_HOSTNAME = "main--adobe-b2b-portal--aemsites.aem.live"
OAUTH_AUTHORIZE_URL = "https://ims-na1.adobelogin.com/ims/authorize/v2"
OAUTH_TOKEN_URL = "https://ims-na1.adobelogin.com/ims/token/v3"
OAUTH_LOGOUT_URL = "https://ims-na1.adobelogin.com/ims/logout/v1"
OAUTH_REDIRECT_URI = "https://b2b.aem.now/auth/callback"
OAUTH_SCOPE = "openid,AdobeID,email,profile"
OAUTH_CLIENT_ID = "aem-sites-cug"
ENVIRONMENT = "prod"
# Bump to revoke all generic event staff-login sessions at once (kill switch).
EVENT_CRED_EPOCH = "1"

# Secrets (set via: wrangler secret put <NAME> --env b2b)
# OAUTH_CLIENT_SECRET = "..."  (same value already used for the summit/default envs — client aem-sites-cug is shared, with multiple registered redirect URIs)
# JWT_SECRET = "..."  (generate a fresh, unique value for this env — do NOT reuse another env's secret)
# EVENT_STAFF_CREDENTIALS = "..."  (newline/comma list of username:sha256hex(password) for on-site iPad logins)
# ORIGIN_AUTHENTICATION = "..."  (site token for the protected origin — required while the b2b origin returns 401 access-not-allowed)
# APO_CLIENT_ID = "..."
# APO_CLIENT_SECRET = "..."
# APO_SCOPE = "..."
# APO_AUTHORIZATION_CODE = "..."  (optional — enables authorization_code IMS grant)

[[env.b2b.kv_namespaces]]
binding = "SESSIONS"
id = "b038dc092aa849a3926096554b67293a"
